<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario CV</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4">Formulario de Perfil Profesional</h1>
            <form>
              <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <input type="text" class="form-control" id="rol" name="rol" placeholder="Ej. Desarrollador Full Stack" />
              </div>

              <div class="mb-3">
                <label for="contacto" class="form-label">Contacto</label>
                <textarea class="form-control" id="contacto" name="contacto" rows="3" placeholder="Correo, teléfono, LinkedIn, ubicación..."></textarea>
              </div>

              <div class="mb-3">
                <label for="experiencia_profesional" class="form-label">Experiencia profesional</label>
                <textarea class="form-control" id="experiencia_profesional" name="experiencia_profesional" rows="4" placeholder="Describe tu experiencia laboral relevante..."></textarea>
                <label for="detalle_cargo" class="form-label mt-2">Cargo, año de inicio y año de finalización</label>
                <input type="text" class="form-control" id="detalle_cargo" name="detalle_cargo" placeholder="Ej. Desarrollador Frontend, 2020 - 2023" />
              </div>

              <div class="mb-3">
                <label for="core_skills" class="form-label">Core skills</label>
                <textarea class="form-control" id="core_skills" name="core_skills" rows="3" placeholder="Una habilidad por línea para lista no numerada"></textarea>
              </div>

              <div class="mb-3">
                <label for="herramientas_tecnicas" class="form-label">Herramientas técnicas</label>
                <textarea class="form-control" id="herramientas_tecnicas" name="herramientas_tecnicas" rows="3" placeholder="Una herramienta por línea para lista no numerada"></textarea>
              </div>

              <div class="mb-3">
                <label for="educacion" class="form-label">Educación</label>
                <textarea class="form-control" id="educacion" name="educacion" rows="3" placeholder="Formación académica, cursos y certificaciones..."></textarea>
              </div>

              <div class="mb-4">
                <label for="idiomas" class="form-label">Idiomas</label>
                <textarea class="form-control" id="idiomas" name="idiomas" rows="3" placeholder="Nivel por idioma (Ej. Inglés C1, Español nativo)"></textarea>
              </div>

              <div class="d-flex flex-wrap gap-2 align-items-center">
                <button type="submit" class="btn btn-primary">Exportar a PDF</button>
                <label for="idioma_interfaz" class="visually-hidden">Idioma</label>
                <select class="form-select w-auto" id="idioma_interfaz" name="idioma_interfaz" aria-label="Seleccionar idioma">
                  <option value="es" selected>Español</option>
                  <option value="en">Inglés</option>
                </select>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
